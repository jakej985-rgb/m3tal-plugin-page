name: Build and Publish Plugin DEBs

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin directory to build and publish (leave empty for smart auto-detect or 'all')"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Packaging Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev apt-utils gnupg curl
          python3 -m pip install --upgrade pip pyyaml

      - name: Smart Auto-Bump & Identify Touched Plugins
        id: targets
        run: |
          INPUT_PLUGIN="${{ github.event.inputs.plugin }}"
          BASE_REF="${{ github.event.before }}"
          [ -z "$BASE_REF" ] || [ "$BASE_REF" = "0000000000000000000000000000000000000000" ] && BASE_REF="HEAD~1"

          if [ -n "$INPUT_PLUGIN" ] && [ "$INPUT_PLUGIN" != "all" ]; then
            echo "Direct plugin requested: $INPUT_PLUGIN"
            ./scripts/smart-bump.py --plugin "$INPUT_PLUGIN" --apply
            TOUCHED="$INPUT_PLUGIN"
          elif [ "$INPUT_PLUGIN" = "all" ]; then
            echo "Force build all plugins requested"
            ./scripts/smart-bump.py --apply --force
            TOUCHED=$(find . -maxdepth 1 -mindepth 1 -type d ! -name '.*' ! -name 'scripts' -exec test -f '{}/plugin.yaml' ';' -exec basename '{}' ';')
          else
            echo "Running smart change detection against base $BASE_REF..."
            # Auto-bump touched plugins and get list
            TOUCHED=$(./scripts/smart-bump.py --base "$BASE_REF" --list-touched)
            if [ -n "$TOUCHED" ]; then
              ./scripts/smart-bump.py --base "$BASE_REF" --apply
            fi
          fi

          if [ -z "$TOUCHED" ]; then
            echo "ℹ️ No plugins were touched. Nothing to bump, build, or publish."
            echo "plugins=" >> $GITHUB_OUTPUT
          else
            echo "🚀 Touched plugins to build: $TOUCHED"
            echo "plugins=$TOUCHED" >> $GITHUB_OUTPUT

            # Auto-commit bumped manifests and changelogs if git working tree has changes
            if [ -n "$(git status --porcelain)" ]; then
              git config user.name "m3tal-bot"
              git config user.email "bot@m3tal.io"
              git add -A
              git commit -m "chore(release): auto-bump version and update CHANGELOG for $TOUCHED [skip ci]" || true
              git push origin main || true
            fi
          fi

      - name: Build and Package Plugins
        id: package
        if: steps.targets.outputs.plugins != ''
        run: |
          mkdir -p dist/packages
          MANIFEST_PAYLOADS="[]"

          for p in ${{ steps.targets.outputs.plugins }}; do
            if [ -f "$p/plugin.yaml" ]; then
              echo "🔨 Packaging plugin $p..."
              ./scripts/build-plugin-deb.sh "$p"
              mv m3tal-plugin-*.deb dist/packages/ 2>/dev/null || true
              mv m3tal-plugin-*.sha256 dist/packages/ 2>/dev/null || true
            fi
          done

          ls -la dist/packages/

      - name: Create / Update GitHub Release
        id: release
        if: hashFiles('dist/packages/*.deb') != ''
        uses: softprops/action-gh-release@v2
        with:
          files: dist/packages/*
          tag_name: plugins-latest
          name: "M3TAL Plugins Release"
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}

      - name: Ingest & Sign DEBs via Central APT Repository (m3tal-apt-key)
        if: hashFiles('dist/packages/*.deb') != ''
        run: |
          for deb in dist/packages/*.deb; do
            [ -f "$deb" ] || continue
            DEB_BASENAME=$(basename "$deb")
            # Parse package_id and version: m3tal-plugin-<name>_<version>_amd64.deb
            PKG_ID=$(echo "$DEB_BASENAME" | cut -d_ -f1)
            PKG_VER=$(echo "$DEB_BASENAME" | cut -d_ -f2)
            DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/plugins-latest/${DEB_BASENAME}"

            echo "🚀 Dispatching $PKG_ID v$PKG_VER to m3tal-apt-key..."

            curl -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${{ secrets.GH_PAT }}" \
              https://api.github.com/repos/jakej985-rgb/m3tal-apt-key/dispatches \
              -d @- << EOF
            {
              "event_type": "publish-deb",
              "client_payload": {
                "package_id": "${PKG_ID}",
                "version": "${PKG_VER}",
                "deb_url": "${DOWNLOAD_URL}",
                "allow_replace": true
              }
            }
          EOF
          done
